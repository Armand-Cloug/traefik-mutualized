name: "🚀 Deploy Traefik — allitu.cloug.fr"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-traefik" to confirm deployment'
        required: true
        default: ''

concurrency:
  group: deploy-traefik-allitu.cloug.fr
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy Traefik on allitu.cloug.fr"
    runs-on: ubuntu-latest
    environment: production

    env:
      SERVER_HOST: "allitu.cloug.fr"
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.ALLITU_SSH_KEY }}

    steps:
      - name: Confirm deployment intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-traefik" ]; then
            echo "❌ Confirmation required — type exactly 'deploy-traefik'."
            exit 1
          fi
          echo "✅ Traefik deployment confirmed by ${{ github.actor }}"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          set -e
          test -n "$SERVER_HOST" || (echo "❌ Missing SERVER_HOST" && exit 1)
          test -n "$SERVER_USER" || (echo "❌ Missing SERVER_USER" && exit 1)
          test -n "$SERVER_SSH_KEY" || (echo "❌ Missing ALLITU_SSH_KEY" && exit 1)
          echo "✅ Required SSH secrets are present"

      - name: Prepare target directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/traefik/traefik
            sudo chown -R "$USER":"$USER" /opt/traefik
            if [ -f /opt/traefik/traefik/acme.json ]; then
              cp /opt/traefik/traefik/acme.json /tmp/traefik-acme.json.backup
            fi
            rm -rf /opt/traefik/* /opt/traefik/.[!.]* /opt/traefik/..?* || true
            mkdir -p /opt/traefik/traefik
            if [ -f /tmp/traefik-acme.json.backup ]; then
              mv /tmp/traefik-acme.json.backup /opt/traefik/traefik/acme.json
              chmod 600 /opt/traefik/traefik/acme.json
            fi

      - name: Upload Traefik project
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          source: "docker-compose.yml,.env.example,traefik,templates,examples,README.md,LICENSE"
          target: "/opt/traefik"
          overwrite: true
          timeout: 120s

      - name: Provision and deploy Traefik
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "[1/5] Docker installation check"
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            fi

            echo "[2/5] Prepare files"
            cd /opt/traefik
            mkdir -p traefik/logs traefik/dynamic
            if [ ! -f traefik/acme.json ]; then
              install -m 600 /dev/null traefik/acme.json || { touch traefik/acme.json && chmod 600 traefik/acme.json; }
            else
              chmod 600 traefik/acme.json
            fi

            echo "[3/5] Generate .env"
            cat > .env <<'ENVEOF'
            TRAEFIK_VERSION=v3.4
            TRAEFIK_HOST=traefik.allitu.cloug.fr
            TRAEFIK_ACME_EMAIL=admin@cloug.fr
            TRAEFIK_LOG_LEVEL=INFO
            TRAEFIK_DASHBOARD=true
            ENVEOF

            sed -i 's/^            //' .env

            echo "[4/5] Create shared network"
            sudo docker network inspect traefik_proxy >/dev/null 2>&1 || sudo docker network create traefik_proxy

            echo "[5/5] Deploy"
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans
            sudo docker ps --format 'table {{.Names}}	{{.Status}}	{{.Ports}}'
