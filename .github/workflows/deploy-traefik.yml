name: "🚀 Deploy Traefik"

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Serveur cible"
        required: true
        type: choice
        options:
          - allitu
          - utilla
          - bde-ensar
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        default: ""

concurrency:
  group: traefik-deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy Traefik to ${{ github.event.inputs.target }}"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target }}

    steps:
      - name: Confirm deploy intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation required: type exactly 'deploy'"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required config
        run: |
          set -e
          test -n "${SERVER_HOST}" || (echo "Missing SERVER_HOST" && exit 1)
          test -n "${SERVER_USER}" || (echo "Missing SERVER_USER" && exit 1)
          test -n "${SSH_PRIVATE_KEY}" || (echo "Missing SSH_PRIVATE_KEY" && exit 1)
          test -n "${DEPLOY_PATH}" || (echo "Missing DEPLOY_PATH" && exit 1)
          echo "Config OK"
        env:
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

      - name: Write SSH key file
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ci
          sed -i 's/\r$//' ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keygen -y -f ~/.ssh/id_ci > /dev/null

      - name: Sanity SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ci \
            ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }} \
            "echo OK && whoami && hostname"

      - name: Prepare target directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            sudo mkdir -p ${{ vars.DEPLOY_PATH }}
            sudo chown -R "$USER":"$USER" ${{ vars.DEPLOY_PATH }}

            if [ -f ${{ vars.DEPLOY_PATH }}/acme.json ]; then
              cp ${{ vars.DEPLOY_PATH }}/acme.json /tmp/traefik-acme.json.backup
            fi

            rm -rf ${{ vars.DEPLOY_PATH }}/* ${{ vars.DEPLOY_PATH }}/.[!.]* ${{ vars.DEPLOY_PATH }}/..?* || true

            mkdir -p ${{ vars.DEPLOY_PATH }}/logs

            if [ -f /tmp/traefik-acme.json.backup ]; then
              mv /tmp/traefik-acme.json.backup ${{ vars.DEPLOY_PATH }}/acme.json
              chmod 600 ${{ vars.DEPLOY_PATH }}/acme.json
            fi

      - name: Upload Traefik files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,templates,README.md,LICENSE"
          target: ${{ vars.DEPLOY_PATH }}
          overwrite: true
          timeout: 120s

      - name: Deploy Traefik
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.SERVER_HOST }}
          username: ${{ vars.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd ${{ vars.DEPLOY_PATH }}

            cat > .env <<EOF
            TRAEFIK_HOST=traefik.${{ vars.SERVER_HOST }}
            TRAEFIK_ACME_EMAIL=armandzireg@gmail.com
            EOF

            mkdir -p logs

            if [ ! -f acme.json ]; then
              sudo install -m 600 /dev/null acme.json
              sudo chown "$USER":"$USER" acme.json
            else
              chmod 600 acme.json
            fi

            sudo docker network create traefik_proxy || true

            sudo docker compose pull
            sudo docker compose up -d
            sudo docker compose ps

            sudo docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
