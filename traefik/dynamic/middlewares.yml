http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          X-XSS-Protection: "1; mode=block"

    # Secret GitHub TRAEFIK_DASHBOARD_AUTH = sortie de : htpasswd -nbB admin 'mot-de-passe'
    # Exemple : admin:$2y$05$xyz...
    dashboard-auth:
      basicAuth:
        users:
          - "DASHBOARD_AUTH_PLACEHOLDER"
